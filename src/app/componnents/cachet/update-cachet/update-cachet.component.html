<!-- Main content -->
<section class="content">
  <div class="container-fluid">
    <h1 class="mt-4 " i18n>{{'page.Mettre à jour le cachet'| translate}}</h1>
    <ol class="breadcrumb mb-4 text-center">
      <li class="breadcrumb-item active" style="background-color: lightblue; border-radius: 2px; margin: 2px; padding: 5px;" i18n>
        Hello M/Mme MONGO SALOMON, il {{ currentTime | date: 'HH:mm' }} en ce jour du {{ currentDay | date: 'EEEE, dd MMMM yyyy' }}.
      </li>
    </ol>
    <div class="row justify-content-center">
      <!-- Horizontal Form -->
      <div class="card card-info col-md-8">
        <!-- form start -->
        <div class="card">
          <div class="card-header">
            <h2 i18n>{{'page.Mettre à jour le cachet'| translate}}</h2>
          </div>
          <div class="card-body">
            <form [formGroup]="companyForm" (ngSubmit)="onSubmit()">
              <div class="row">


                <div class="col-md-6">
                  <div class="form-group">
                    <label for="author" i18n>{{'page.Auteur'| translate}}</label>
                    <input id="author" formControlName="author" class="form-control" type="text" />
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="form-group">
                    <label for="phone" i18n>{{'page.Téléphone'| translate}}</label>
                    <input id="phone" formControlName="phone" class="form-control" type="text" />
                  </div>
                </div>
              </div>




              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label for="member_id" i18n>{{'page.membres'| translate}}</label>
                    <select id="member_id" formControlName="member_id" class="form-control">
                      <option *ngFor="let country of members" [value]="country.id">{{ country.firstname }}</option>
                    </select>
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="form-group">
                    <label for="city_id" i18n>{{'page.Ville'| translate}}</label>
                    <select id="city_id" formControlName="city_id" class="form-control">
                      <option *ngFor="let city of cities" [value]="city.id">{{ city.name }}</option>
                    </select>
                  </div>
                </div>
              </div>



              <div class="row">

                <div class="col-md-6">
                  <div class="form-group">
                    <label for="name" i18n>Num recep</label>
                    <input id="name" formControlName="receipt_number" class="form-control" type="text" />
                  </div>
                </div>

                <div class="col-md-6">
                  <label for="name" i18n>{{'page.Statut'| translate}}</label>
                  <select id="status" formControlName="status" class="form-control" required>
                    <option value="" disabled selected>Choisir un statut</option>
                    <option *ngFor="let option of statusOptions" [value]="option.value">{{ option.label}}</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label for="year" i18n>{{'page.Année'| translate}}</label>
                  <input id="year" formControlName="year" class="form-control" type="date" />
                </div><br><br>



              </div><br>

              <button type="submit" class="btn btn-primary" i18n>{{'page.Modifier le cachet'| translate}}</button>
            </form>
          </div>
        </div>

      </div>
      <!-- /.card -->
    </div>
    <!-- /.row -->
  </div><!-- /.container-fluid -->
</section>
<!-- /.content -->
