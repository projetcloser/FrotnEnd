<div class="container mt-5">
  <div class="card shadow-lg p-4 border-0">
    <h3 class="card-title text-center text-primary">{{'page.titleStore'| translate}}</h3>
    <form [formGroup]="addForm" (ngSubmit)="onSubmit()">

      <!-- Champ pour la date (readonly) avec icône -->
      <div class="form-group mb-4">
        <label for="date" class="form-label"><i class="fas fa-calendar-alt me-2"></i>Date</label>
        <input type="text" id="date" class="form-control border-0 bg-light" formControlName="certification_date" readonly>
      </div>
      <input type="hidden" formControlName="ref_dem_part"  [value]="reference">

      <!-- Champ pour l'auteur (readonly) avec icône -->
      <div class="form-group mb-4">
        <label for="author" class="form-label"><i class="fas fa-user me-2"></i>{{'page.Auteur'| translate}}</label>
        <input type="text" id="author" class="form-control border-0 bg-light" formControlName="author" readonly>
      </div>

      <!-- Champ pour l'objet avec icône -->
      <div class="form-group mb-4">
        <label for="objet" class="form-label"><i class="fas fa-info-circle me-2"></i>{{'page.Objet'| translate}} *</label>
        <textarea id="object" class="form-control" formControlName="object" rows="3" placeholder="Décrivez l'objet de l'attestation" style="height: 150px;" required></textarea>
      </div>

      <!-- Champ pour le montant avec icône -->
      <!-- <div class="form-group mb-4">
        <label for="cashflow_id" class="form-label"><i class="fas fa-dollar-sign me-2"></i>Caisse</label>
        <select formControlName="cashflow_id" class="form-control">
          <option *ngFor="let caisse of caisses" [value]="caisse.id">{{ caisse.name }}</option>
        </select>
      </div> -->

      <!-- Champ pour la sélection du membre avec icône -->
      <div *ngIf="user.role.id !== 1" class="form-group mb-4">
        <label for="member_id" class="form-label"><i class="fas fa-user-friends me-2"></i>{{'page.membres'| translate}}  *</label>
        <select id="member_id" class="form-select" formControlName="member_id" required>
          <option value="" disabled>Sélectionnez un membre</option>
          <option *ngFor="let membre of membres" [value]="membre.id">
            {{ membre.firstname }} {{ membre.lastname }}
          </option>
        </select>
      </div>

      <div *ngIf="user.role.id === 1"class="form-group mb-4">
        <label for="member_id" class="form-label" i18n><i class="fas fa-user-friends me-2"></i>{{'page.membres'| translate}}</label>
        <select id="member_id" class="form-select" formControlName="member_id">
          <option  value="{{ user.perso.id }}" selected>
            {{ user.perso.firstname }} {{ user.perso.lastname }}
          </option>
        </select>
      </div>

      <!-- Boutons Enregistrer et Annuler -->
      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary px-5 me-3">
          <i class="fas fa-save me-2"></i>{{'page.Enregistrer'| translate}} 
        </button>
        <button type="button" class="btn btn-secondary px-4" (click)="cancel()">
          <i class="fas fa-times me-2"></i>{{'page.Annuler'| translate}} 
        </button>
      </div>
    </form>
  </div>
</div>
