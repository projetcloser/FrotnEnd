<div class="container mt-5">
  <h2 class="mb-4" i18n>Liste des Dettes</h2>

  <div class="d-flex justify-content-between mb-3">
    <input type="text" [(ngModel)]="searchTerm" (input)="filterDettes()" class="form-control w-50" placeholder="Rechercher par nom ou montant...">
    <!-- <button [routerLink]="['/Closer/dettes/new']" routerLinkActive="router-link-active"  class="btn btn-primary">Ajouter une Dette <i class="fas fa-plus"></i></button> -->
  </div>

  <table class="table table-striped">
    <thead>
      <tr>
        <!-- <th>ID</th> -->
        <th i18n>Nom du Membre</th>
        <th i18n>Montant</th>
        <th i18n>Date d'Échéance</th>
        <th i18n>Statut</th>
        <th scope="col" i18n>
          Prévisualisation</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let dette of filteredDettes">
        <!-- <td>{{ dette.id }}</td>       -->
        <td>{{ getMembreNom(dette.membre_id) }}</td>
        <td>{{ dette.montant | currency:'XAF':'symbol' }}</td>
        <td>{{ dette.date_echeance | date }}</td>
        <td>
          <span class="bg-badge" [ngClass]="{'bg-success': dette.statut === 'Payé', 'bg-danger': dette.statut === 'Non payé'}">
            {{ dette.statut }}
          </span>
        </td>
        <td>
          <!-- Bouton de paiement avec badge -->
          <a (click)="payer(dette)" style="cursor: pointer;" target="_blank" i18n>
           <span class="custom-badge status-red">
             <span class="badge badge-danger badge-pill">
               <i class="fa fa-money" aria-hidden="true"></i> ICI POUR PAYER
             </span>
           </span>
         </a>
       </td>
        <!-- <td>
          <button (click)="viewDetails(dette.id)" class="btn btn-outline-info btn-sm" i18n>
            <i class="fas fa-eye"></i> Détails
          </button>
          <button (click)="editDette(dette.id)" class="btn btn-outline-warning btn-sm" i18n>
            <i class="fas fa-pencil-alt"></i> Modifier
          </button>
          <button (click)="deleteDette(dette.id)" class="btn btn-outline-danger btn-sm" i18n>
            <i class="fas fa-trash"></i> Supprimer
          </button>
        </td> -->
      </tr>
    </tbody>
  </table>
</div>
