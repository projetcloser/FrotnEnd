<div class="container">
  <div class="forgot-password-container">
    <i class="fas fa-unlock-alt fa-3x text-primary mb-3"></i>
    <h2>Mot de Passe Oublié</h2>
    <p class="info-text">Veuillez entrer votre matricule et votre email pour réinitialiser votre mot de passe.</p>
    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
      <div class="mb-3 text-start">
        <label for="matricule" class="form-label">Matricule</label>
        <input type="text" id="matricule" formControlName="matricule" class="form-control" placeholder="Entrez votre matricule">
      </div>
      <div class="mb-3 text-start">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" formControlName="email" class="form-control" placeholder="Entrez votre email">
      </div>
      <button type="submit" class="btn btn-submit" [disabled]="forgotPasswordForm.invalid">
        <i class="fas fa-paper-plane"></i> Envoyer
      </button>
    </form>
    <p *ngIf="message" class="mt-3 text-success">{{ message }}</p>
  </div>
</div>
